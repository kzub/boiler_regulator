services:
  boiler-regulator:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      CONTROLLER_BASE_URL: ${CONTROLLER_BASE_URL:?Set CONTROLLER_BASE_URL in .env}
      CONTROLLER_TIMEOUT_MS: ${CONTROLLER_TIMEOUT_MS:-20000}
      PORT: 8080
      HOST: 0.0.0.0
      STATUS_POLL_INTERVAL_MS: ${STATUS_POLL_INTERVAL_MS:-5000}
      MOTION_POLL_INTERVAL_MS: ${MOTION_POLL_INTERVAL_MS:-300}
      MOTION_TIMEOUT_MS: ${MOTION_TIMEOUT_MS:-30000}
      AUTO_CALIBRATE: ${AUTO_CALIBRATE:-true}
      CALIBRATION_DATA_PATH: /data/calibration.json
    volumes:
      - calibration-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  calibration-data:
